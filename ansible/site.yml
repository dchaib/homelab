---
- name: Configure services VM base system
  ansible.builtin.import_playbook: playbooks/services-base.yml

- name: Configure NAS base system
  ansible.builtin.import_playbook: playbooks/nas-base.yml

- name: Install OpenZFS on the NAS
  ansible.builtin.import_playbook: playbooks/nas-zfs.yml

# The mirror must be created manually before this playbook runs on a new NAS.
- name: Configure NAS datasets
  ansible.builtin.import_playbook: playbooks/nas-storage.yml

- name: Configure NAS SMB shares
  ansible.builtin.import_playbook: playbooks/nas-shares.yml

- name: Configure services hosts
  ansible.builtin.import_playbook: playbooks/services-host.yml

- name: Deploy services
  ansible.builtin.import_playbook: playbooks/services.yml

- name: Configure native monitoring
  ansible.builtin.import_playbook: playbooks/monitoring.yml
