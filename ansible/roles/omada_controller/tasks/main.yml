---
- name: Create Omada group
  ansible.builtin.group:
    name: omada
    gid: 508
    state: present
  become: true

- name: Create Omada user
  ansible.builtin.user:
    name: omada
    group: omada
    groups:
      - '{{ users.app_user.group }}'
    uid: 508
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present
  become: true

- name: Add app user to Omada group
  ansible.builtin.user:
    name: "{{ users.app_user.name }}"
    groups:
      - omada
    append: true
  become: true

- name: Deploy Omada Controller
  ansible.builtin.include_role:
    name: docker_compose_stack
  vars:
    docker_compose_stack_name: '{{ omada_controller_stack_name }}'
    docker_compose_stack_volumes: '{{ omada_controller_docker_volumes.values() | list }}'
    docker_compose_stack_owner: omada
    docker_compose_stack_group: omada
    docker_compose_stack_uid: 508
    docker_compose_stack_gid: 508
