---
- name: Create configuration directory
  ansible.builtin.file:
    path: '{{ adguard_home_config_folder }}'
    state: directory
    owner: '{{ users.app_user.name }}'
    group: '{{ users.app_user.group }}'
    mode: '0750'
  become: true

- name: Copy configuration file
  ansible.builtin.template:
    src: 'AdGuardHome.yaml.j2'
    dest: '{{ adguard_home_config_folder }}/AdGuardHome.yaml'
    owner: '{{ users.app_user.name }}'
    group: '{{ users.app_user.group }}'
    mode: '0600'
  become: true
  register: adguard_home_config_result

- name: Deploy AdGuard Home
  ansible.builtin.include_role:
    name: docker_compose_stack
  vars:
    docker_compose_stack_name: '{{ adguard_home_stack_name }}'
    docker_compose_stack_volumes: '{{ adguard_home_docker_volumes.values() | list }}'
    docker_compose_stack_recreate: "{{ adguard_home_config_result.changed }}"
