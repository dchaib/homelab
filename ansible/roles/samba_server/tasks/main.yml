---
- name: Require account declarations to be mappings
  ansible.builtin.assert:
    that:
      - item is mapping
  loop: "{{ nas_samba_accounts }}"
  no_log: true

- name: Initialize public account metadata
  ansible.builtin.set_fact:
    samba_server_account_metadata: []

- name: Collect account metadata without passwords
  ansible.builtin.set_fact:
    samba_server_account_metadata: >-
      {{ samba_server_account_metadata +
      [{'name': item.get('name'), 'manage_unix_account': item.get('manage_unix_account')}] }}
  loop: "{{ nas_samba_accounts }}"
  no_log: true

- name: Validate account names and Unix management policy
  ansible.builtin.assert:
    that:
      - item.name is string
      - item.name is match('^[a-z_][a-z0-9_-]{0,31}$')
      - item.manage_unix_account is boolean
    fail_msg: >-
      Each account needs a lowercase Unix name of at most 32 characters
      and a boolean manage_unix_account.
  loop: "{{ samba_server_account_metadata }}"
  loop_control:
    label: "{{ item.name | default('missing name', true) }}"

- name: Validate declared account passwords
  ansible.builtin.assert:
    that:
      - item.password is defined
      - item.password is string
      - item.password | length > 0
    fail_msg: Each declared Samba account needs a nonempty string password, preferably stored in Vault.
  loop: "{{ nas_samba_accounts }}"
  no_log: true

- name: Require unique account and share names
  ansible.builtin.assert:
    that:
      - samba_server_account_metadata | map(attribute='name') | unique | length == samba_server_account_metadata | length
      - nas_samba_shares | map(attribute='name') | map('lower') | unique | length == nas_samba_shares | length

- name: Validate share access lists
  ansible.builtin.assert:
    that:
      - (item.readers | default([]) | intersect(item.writers | default([]))) | length == 0
      - ((item.readers | default([])) + (item.writers | default([]))) | length > 0
      - >-
        (((item.readers | default([])) + (item.writers | default([]))) |
        difference(samba_server_account_metadata | map(attribute='name') | list)) | length == 0
  loop: "{{ nas_samba_shares }}"
  loop_control:
    label: "{{ item.name }}"

- name: Initialize the shared dataset list
  ansible.builtin.set_fact:
    samba_server_datasets: []

- name: Collect shared datasets and their children
  ansible.builtin.set_fact:
    samba_server_datasets: >-
      {{ (samba_server_datasets + [item.dataset] + (item.child_datasets | default([]))) | unique }}
  loop: "{{ nas_samba_shares }}"
  loop_control:
    label: "{{ item.name }}"

- name: Inspect shared dataset mounts
  community.general.zfs_facts:
    name: "{{ nas_zfs_pool_name }}"
    recurse: true
    type: filesystem
    properties: mounted,mountpoint
  register: samba_server_dataset_mounts
  become: true

- name: Require datasets to be mounted at the expected paths
  ansible.builtin.assert:
    that:
      - samba_server_dataset_facts | length == 1
      - samba_server_dataset_facts[0].mounted == 'yes'
      - samba_server_dataset_facts[0].mountpoint == nas_zfs_mountpoint ~ '/' ~ item
    fail_msg: >-
      {{ nas_zfs_pool_name }}/{{ item }} must be mounted at
      {{ nas_zfs_mountpoint }}/{{ item }} before configuring shares.
  vars:
    samba_server_dataset_facts: >-
      {{ samba_server_dataset_mounts.ansible_facts.ansible_zfs_datasets |
      selectattr('name', 'equalto', nas_zfs_pool_name ~ '/' ~ item) | list }}
  loop: "{{ samba_server_datasets }}"

- name: Inspect Unix accounts
  ansible.builtin.getent:
    database: passwd
    key: "{{ item.name }}"
    fail_key: false
  loop: "{{ samba_server_account_metadata }}"
  loop_control:
    label: "{{ item.name }}"
  register: samba_server_unix_accounts

- name: Require externally managed Unix accounts to exist
  ansible.builtin.assert:
    that:
      - item.ansible_facts.getent_passwd[item.item.name] is not none or item.item.manage_unix_account
    fail_msg: >-
      An externally managed Unix account is absent. Create it before running
      nas-shares.yml; the Samba role preserves existing administrative accounts.
  loop: "{{ samba_server_unix_accounts.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Refuse unexpected existing Unix service accounts
  ansible.builtin.assert:
    that:
      - samba_server_unix_entry | length >= 6
      - samba_server_unix_entry[1] | int > 0
      - samba_server_unix_entry[2] | int > 0
      - samba_server_unix_entry[5] in ['/usr/sbin/nologin', '/sbin/nologin', '/bin/false', '/usr/bin/false']
    fail_msg: >-
      Existing service account {{ item.item.name }} has an unexpected UID, GID
      or shell. Inspect it manually; this role will not change it automatically.
  vars:
    samba_server_unix_entry: "{{ item.ansible_facts.getent_passwd[item.item.name] }}"
  loop: "{{ samba_server_unix_accounts.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.item.manage_unix_account
    - item.ansible_facts.getent_passwd[item.item.name] is not none

- name: Install Samba and ACL tools
  ansible.builtin.apt:
    name:
      - samba
      - acl
    state: present
    update_cache: true
  become: true

- name: Inspect Samba accounts
  ansible.builtin.command:
    argv:
      - pdbedit
      - -L
  register: samba_server_accounts
  changed_when: false
  check_mode: false
  become: true

- name: Collect existing Samba account names
  ansible.builtin.set_fact:
    samba_server_account_names: >-
      {{ samba_server_accounts.stdout_lines | map('split', ':', 1) | map('first') | list }}

- name: Create missing Unix service accounts
  ansible.builtin.user:
    name: "{{ item.item.name }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    password_lock: true
    state: present
  loop: "{{ samba_server_unix_accounts.results }}"
  when:
    - item.ansible_facts.getent_passwd[item.item.name] is none
    - item.item.manage_unix_account
  loop_control:
    label: "{{ item.item.name }}"
  become: true

- name: Configure root ACLs for each share
  ansible.builtin.include_tasks: share-acls.yml
  loop: "{{ nas_samba_shares }}"
  loop_control:
    loop_var: samba_server_share
    label: "{{ samba_server_share.name }}"

- name: Configure Samba shares
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
    validate: testparm -s %s
  notify: Restart Samba
  become: true

# Existing passwords are preserved; rotation is an explicit operation.
- name: Create missing Samba accounts
  ansible.builtin.command:
    argv:
      - smbpasswd
      - -a
      - -s
      - "{{ item.name }}"
    stdin: "{{ item.password }}\n{{ item.password }}"
  loop: "{{ nas_samba_accounts }}"
  when: item.name not in samba_server_account_names and not ansible_check_mode
  changed_when: true
  become: true
  no_log: true

- name: Enable and start Samba
  ansible.builtin.systemd_service:
    name: smbd
    enabled: true
    state: started
  become: true
