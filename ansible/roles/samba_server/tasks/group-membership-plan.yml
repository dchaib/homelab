---
- name: Require access groups to remain supplementary groups
  ansible.builtin.assert:
    that:
      - item.value[2] not in samba_server_managed_gids
    fail_msg: A managed access group is used as a primary group. Resolve this before reconciling memberships.
  vars:
    samba_server_managed_gids: >-
      {{ ansible_facts.getent_group | dict2items |
         selectattr('key', 'in', samba_server_groups | map(attribute='name') | list) | map(attribute='value.1') | list }}
  loop: "{{ ansible_facts.getent_passwd | dict2items }}"
  loop_control:
    label: primary group check

- name: Initialize access group membership changes
  ansible.builtin.set_fact:
    samba_server_membership_changes: []

- name: Calculate exact membership changes for the declared access groups
  ansible.builtin.set_fact:
    samba_server_membership_changes: "{{ samba_server_membership_changes + [item] }}"
  loop: "{{ samba_server_groups }}"
  when: >-
    (ansible_facts.getent_group[item.name][2].split(',') | reject('equalto', '') | unique | sort | list)
    != (item.members | unique | sort | list)
  no_log: true
