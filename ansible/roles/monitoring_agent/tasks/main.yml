---
- name: Configure SMART metrics exporter
  ansible.builtin.import_tasks: smartctl.yml
  when: monitoring_agent_smartctl_exporter_enabled | bool

- name: Install and configure Alloy
  ansible.builtin.import_tasks: alloy.yml

# Apply unit changes before first start; subsequent runs do not reload systemd.
- name: Apply monitoring service configuration changes
  ansible.builtin.meta: flush_handlers

- name: Enable smartctl exporter service
  ansible.builtin.systemd_service:
    name: smartctl_exporter
    enabled: true
    state: started
  become: true
  when: monitoring_agent_smartctl_exporter_enabled | bool

- name: Enable Alloy service
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
  become: true
