---
- name: Install system update metrics prerequisites
  ansible.builtin.apt:
    name:
      - cron
      - python3-apt
      - needrestart
      - util-linux
      - coreutils
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create shared textfile collector directory
  ansible.builtin.file:
    path: '{{ monitoring_textfile_directory }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install system update metrics collector
  ansible.builtin.copy:
    src: collect.py
    dest: /usr/local/bin/collect-system-updates
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Enable cron for system update metrics
  ansible.builtin.service:
    name: cron
    enabled: true
    state: started
  become: true

- name: Schedule daily system update metrics collection
  ansible.builtin.cron:
    name: Collect pending APT updates and reboot status
    user: root
    hour: '{{ system_update_metrics_cron_hour }}'
    minute: '{{ system_update_metrics_cron_minute }}'
    job: >-
      /usr/bin/flock -n /run/lock/system-update-metrics.lock
      /usr/local/bin/collect-system-updates
      --output {{ (monitoring_textfile_directory ~ '/system_updates.prom') | quote }}
      2>&1 | /usr/bin/logger -t system-update-metrics
  become: true
