---
- name: Verify that the host distribution is supported
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
    fail_msg: >-
      The docker role currently supports Debian and Ubuntu hosts only.

- name: Remove distribution Docker packages that conflict with Docker CE
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
  become: true

- name: Install prerequisites for the Docker APT repository
  ansible.builtin.apt:
    name:
      - ca-certificates
    state: present
    update_cache: true
  become: true

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install the Docker APT signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Configure the Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  become: true

- name: Install Docker Engine and Docker Compose plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true

- name: Configure Docker daemon logging
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "20m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart docker

- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  become: true

- name: Create Docker root directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: '{{ users.app_user.name }}'
    group: '{{ users.app_user.group }}'
    mode: '0750'
  loop:
    - "{{ docker_compose_dir }}"
    - "{{ docker_config_dir }}"
    - "{{ docker_volumes_dir }}"
  become: true
