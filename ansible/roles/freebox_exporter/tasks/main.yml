---
- name: Create configuration directory
  ansible.builtin.file:
    path: '{{ freebox_exporter_config_folder }}'
    state: directory
    owner: '{{ users.app_user.name }}'
    group: '{{ users.app_user.group }}'
    mode: '0750'
  become: true

- name: Copy configuration file
  ansible.builtin.copy:
    src: 'config.toml'
    dest: '{{ freebox_exporter_config_folder }}/config.toml'
    owner: '{{ users.app_user.name }}'
    group: '{{ users.app_user.group }}'
    mode: '0640'
  become: true
  register: freebox_exporter_config_result

- name: Deploy Freebox Exporter
  ansible.builtin.include_role:
    name: docker_compose_stack
  vars:
    docker_compose_stack_name: '{{ freebox_exporter_stack_name }}'
    docker_compose_stack_volumes: '{{ freebox_exporter_docker_volumes.values() | list }}'
    docker_compose_stack_recreate: "{{ freebox_exporter_config_result.changed }}"
