---
nas_management_subnet: 192.168.1.0/24

nas_zfs_pool_name: tank
nas_zfs_mountpoint: /srv/storage
nas_zfs_root_properties:
  compression: lz4
  atime: 'off'
  acltype: posix
  xattr: sa

nas_user_1: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  33663831393836656363316461333532346661353031373731613934393439336135666262366135
  6565336231636166643234326166326465313561636162320a386130333063626466386131343433
  38356539316334656537653761646630353535353435373937373364643432656464396139306633
  3639343230366235370a356361383065643062343162306139656262636566623734383039303766
  6537
nas_samba_user_1_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  64386439303233353630356239313362343737613930383066303266386564383366393163363636
  3035663735313638633935383732383665313535616563330a653935373836636566363336373362
  62613563373934646366303363646535303639663537393039646662363139376464643437393634
  6539623733633938340a333333333566386363613965396635393436383563396235326134343630
  3935

nas_zfs_datasets:
  - name: personal
    properties:
      canmount: 'off'
  - name: "personal/{{ nas_user_1 }}"

  - name: shared
    properties:
      canmount: 'off'
  - name: shared/documents
  - name: shared/photos
    properties:
      recordsize: '1048576'  # 1 MiB

  - name: media
  - name: media/movies
    properties:
      recordsize: '1048576'  # 1 MiB
  - name: media/tv
    properties:
      recordsize: '1048576'  # 1 MiB
  - name: media/anime
    properties:
      recordsize: '1048576'  # 1 MiB
  - name: media/music
  - name: media/music-videos
    properties:
      recordsize: '1048576'  # 1 MiB

  - name: software
    properties:
      recordsize: '1048576'  # 1 MiB

  - name: apps
    properties:
      canmount: 'off'
  - name: apps/paperless
    properties:
      canmount: 'off'
  - name: apps/paperless/media
  - name: apps/paperless/consume
  - name: apps/paperless/export

  - name: backups
    properties:
      canmount: 'off'
  - name: backups/computers
    properties:
      canmount: 'off'
  - name: backups/computers/pc-01
  - name: backups/services
  - name: backups/home-assistant
    properties:
      recordsize: '1048576'  # 1 MiB

nas_zfs_directories:
  - software/applications
  - software/games

nas_samba_workgroup: "{{ nas_smb_workgroup }}"
nas_samba_accounts:
  - name: "{{ nas_user_1 }}"
    password: "{{ nas_samba_user_1_password }}"
  - name: "{{ nas_smb_connections.dockerbackup.username }}"
    password: "{{ nas_smb_connections.dockerbackup.password }}"
  - name: "{{ nas_smb_connections.paperless.username }}"
    password: "{{ nas_smb_connections.paperless.password }}"
  - name: "{{ nas_smb_connections.homeassistant.username }}"
    password: "{{ nas_smb_connections.homeassistant.password }}"

# Dataset names are relative to nas_zfs_pool_name and nas_zfs_mountpoint.
nas_samba_shares:
  - name: "{{ nas_user_1 | capitalize }}"
    dataset: "personal/{{ nas_user_1 }}"
    writers:
      - "{{ nas_user_1 }}"
  - name: Documents
    dataset: shared/documents
    writers:
      - "{{ nas_user_1 }}"
  - name: Photos
    dataset: shared/photos
    writers:
      - "{{ nas_user_1 }}"
  - name: Media
    dataset: media
    # Each child filesystem needs its own root ACL and mount check.
    child_datasets:
      - media/movies
      - media/tv
      - media/anime
      - media/music
      - media/music-videos
    writers:
      - "{{ nas_user_1 }}"
  - name: Software
    dataset: software
    writers:
      - "{{ nas_user_1 }}"
  - name: PC-01
    dataset: backups/computers/pc-01
    writers:
      - "{{ nas_user_1 }}"
  - name: "{{ nas_smb_connections.homeassistant.shares.backups }}"
    dataset: backups/home-assistant
    browseable: false
    writers:
      - "{{ nas_smb_connections.homeassistant.username }}"
  - name: "{{ nas_smb_connections.dockerbackup.shares.backups }}"
    dataset: backups/services
    browseable: false
    writers:
      - "{{ nas_smb_connections.dockerbackup.username }}"
  - name: "{{ nas_smb_connections.paperless.shares.media }}"
    dataset: apps/paperless/media
    browseable: false
    writers:
      - "{{ nas_smb_connections.paperless.username }}"
  - name: "{{ nas_smb_connections.paperless.shares.consume }}"
    dataset: apps/paperless/consume
    writers:
      - "{{ nas_smb_connections.paperless.username }}"
      - "{{ nas_user_1 }}"
  - name: "{{ nas_smb_connections.paperless.shares.export }}"
    dataset: apps/paperless/export
    readers:
      - "{{ nas_user_1 }}"
    writers:
      - "{{ nas_smb_connections.paperless.username }}"

ufw_rules:
  - rule: allow
    port: "22"
    proto: tcp
    comment: SSH from management LAN
    from_ip: "{{ nas_management_subnet }}"
  - rule: allow
    port: "445"
    proto: tcp
    comment: SMB from local LAN
    from_ip: "{{ nas_management_subnet }}"
